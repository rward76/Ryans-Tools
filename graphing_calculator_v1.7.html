<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Graphing Calculator</title>
<style>
/* Layout: header bar · 384px expression sidebar · full-height graph viewport with floating panels (same shell as the suite's other apps). Dark-only by design. */
:root{color-scheme:dark;--g950:#030712;--g900:#111827;--g800:#1f2937;--g700:#374151;--g600:#4b5563;--g500:#6b7280;--g400:#9ca3af;--g300:#d1d5db;--g200:#e5e7eb;--g100:#f3f4f6;--blue7:#1d4ed8;--blue6:#2563eb;--blue5:#3b82f6;--blue4:#60a5fa;--blue3:#93c5fd;--purple6:#9333ea;--purple4:#c084fc;--pink4:#f472b6;--emerald6:#059669;--emerald5:#10b981;--emerald4:#34d399;--amber3:#fcd34d;--amber4:#fbbf24;--rose4:#fb7185;--f-sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--f-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;--f-math:"Cambria Math","STIX Two Math","Latin Modern Math","STIX Two Text","Times New Roman",serif}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--g950);color:var(--g100);font-family:var(--f-sans);font-size:14px;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*:before,*:after{box-sizing:border-box}
button,select,output,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue5);outline-offset:2px}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--g900)}::-webkit-scrollbar-thumb{background:var(--g700);border-radius:3px}
svg.i{width:14px;height:14px;flex:none}
header{background:var(--g900);border-bottom:1px solid var(--g800);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;flex:none}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{background:linear-gradient(to top right,var(--blue6),var(--purple6));padding:8px;border-radius:8px;box-shadow:0 10px 15px -3px #0006;display:grid;place-items:center}
.logo svg{width:20px;height:20px;color:#fff}
h1{margin:0;font-size:18px;font-weight:700;line-height:1.4;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1 .grad{background:linear-gradient(to right,var(--blue4),var(--purple4),var(--pink4));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge-v{font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;background:#1e3a8a99;color:var(--blue3);border:1px solid var(--blue7)}
.hctl{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:12px}
.seg{display:flex;align-items:center;background:var(--g800);border:1px solid var(--g700);border-radius:8px;padding:4px;font-size:12px;flex-wrap:wrap}
.seg .lbl{color:var(--g400);padding:0 8px;font-weight:500}
.seg button{background:transparent;border:0;padding:4px 10px;border-radius:4px;color:var(--g300);cursor:pointer;transition:color .15s,background .15s;display:flex;align-items:center;gap:6px}
.seg button:hover{color:#fff}
.seg button[aria-pressed=true]{background:var(--blue6);color:#fff;font-weight:600;box-shadow:0 1px 3px #0006}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg.wide button{justify-content:center}
.row{flex:1;display:flex;overflow:hidden;min-height:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
aside{width:384px;background:var(--g900);border-right:1px solid var(--g800);overflow-y:auto;flex:none}
.stack{padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:#1f293799;padding:14px;border-radius:12px;border:1px solid rgba(55,65,81,.6);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-h .t{font-size:12px;font-weight:700;color:var(--g200);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:8px}
.pill{font-size:10px;background:var(--g700);color:var(--g300);padding:2px 8px;border-radius:999px;font-family:var(--f-mono);white-space:nowrap}
.c-blue{color:var(--blue4)}.c-purple{color:var(--purple4)}.c-emerald{color:var(--emerald4)}.c-amber{color:var(--amber4)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:600 11.5px var(--f-sans);background:var(--g800);color:var(--g300);border:1px solid var(--g700);border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--g500);color:#fff}
.fmenu{display:flex;flex-direction:column;gap:6px}
.fcat{border:1px solid rgba(55,65,81,.6);border-radius:8px;background:var(--g900)}
.fcat>summary{cursor:pointer;padding:8px 10px;font-size:12px;font-weight:600;color:var(--g200);list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none}
.fcat>summary::-webkit-details-marker{display:none}
.fcat>summary:after{content:"";width:6px;height:6px;border-right:1.6px solid var(--g400);border-bottom:1.6px solid var(--g400);transform:rotate(-45deg);transition:transform .15s;margin-right:3px}
.fcat[open]>summary:after{transform:rotate(45deg)}
.fcat>summary:hover{color:#fff}
.fcat>summary small{font-weight:400;color:var(--g500);margin-left:auto;font-size:11px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:5px;padding:2px 8px 9px}
.fgrid.wide{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.fbtn{font:15px var(--f-math);background:var(--g800);border:1px solid var(--g700);border-radius:6px;padding:5px 4px;color:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn:hover{border-color:var(--blue5);background:#1e3a8a40}
.fbtn i{font-style:italic}.fbtn sup{font-size:.7em;vertical-align:.45em;line-height:0}.fbtn sub{font-size:.7em;vertical-align:-.2em;line-height:0}
.fcat .chips{padding:2px 8px 9px}
.brad{display:inline-flex;align-items:stretch;vertical-align:-.1em}.brad .rsv{width:.55em;height:auto;margin-right:-1px}.brad>span{border-top:1.2px solid currentColor;padding:0 .12em}.brad sup{font-size:.6em;align-self:flex-start;margin-right:-.3em;vertical-align:0;line-height:1}
.toggles{display:flex;flex-direction:column;gap:9px;font-size:12px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--g300);cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--emerald5);cursor:pointer;margin:0}
.muted{color:var(--g500);font-size:11px;margin:0;line-height:1.6}
.muted code{font-family:var(--f-mono);color:var(--g300);background:var(--g950);border:1px solid var(--g800);border-radius:4px;padding:0 4px}
.muted b{color:var(--g300)}
.btnrow{display:flex;gap:8px}
.btnrow .btn{flex:1}
.btn{font-size:11.5px;background:var(--g700);color:var(--g100);border:0;padding:7px 10px;border-radius:8px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn:hover{background:var(--g600)}
.btn.imp{background:var(--blue6);color:#fff}.btn.imp:hover{background:var(--blue5)}
.btn svg{width:12px;height:12px}
.keys{font:10px/1.7 var(--f-mono);color:var(--g500);padding:0 4px;margin-top:-6px}
.win{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font:11px var(--f-mono);color:var(--g400)}
.win input,.n{width:100%;min-width:0;background:var(--g950);border:1px solid var(--g700);border-radius:6px;font:11px var(--f-mono);color:var(--g200);padding:4px 6px;text-align:center}
.win input:focus,.n:focus{outline:0;border-color:var(--blue5)}

/* expression list */
.exl{display:flex;flex-direction:column;border:1px solid var(--g700);border-radius:10px;overflow:hidden;background:var(--g950)}
.ex{display:grid;grid-template-columns:34px minmax(0,1fr) 28px;border-bottom:1px solid var(--g800);--c:var(--blue4)}
.ex:last-child{border-bottom:0}
.ex.sel{background:#1e3a8a22;box-shadow:inset 3px 0 0 var(--blue5)}
.ex .tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0;background:var(--g900);border-right:1px solid var(--g800)}
.ex .tab .n0{font:9.5px var(--f-mono);color:var(--g500)}
.cdot{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--c);background:var(--c);cursor:pointer;padding:0;display:grid;place-items:center;transition:background .15s,opacity .15s}
.cdot.off{background:transparent}
.cdot.na{border-color:var(--g700);background:transparent;cursor:default;opacity:.6}
.cdot.na.sld{border-color:var(--amber4);opacity:.9}
.ex .body{padding:7px 8px 8px;min-width:0;display:flex;flex-direction:column;gap:6px}
.mf{position:relative;font-family:var(--f-math);font-size:18px;color:#fff;min-height:32px;padding:3px 4px;cursor:text;overflow-x:auto;overflow-y:hidden;white-space:nowrap;line-height:1.4;border-radius:6px;scrollbar-width:thin}
.ex.editing .mf{background:#0b1220;box-shadow:inset 0 0 0 1px #3b82f655}
.mta{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;resize:none;overflow:hidden;pointer-events:none;font-size:16px}
.mf .ph{color:var(--g600);font:500 13.5px var(--f-mono)}
.mf .blk{display:inline-block}
.mf .blk.empty{min-width:.6em;height:.95em;border:1px dashed var(--g500);border-radius:2px;vertical-align:-.12em;background:#ffffff0a}
.mf .blk.root.empty{border:0;background:none;min-width:2px;height:auto}
.mf .ch.v{font-style:italic}.mf .ch.fnc{font-style:normal}
.mf .ch.op{margin:0 .22em}.mf .ch.cm{margin-right:.28em}.mf .ch.cl{margin:0 .18em 0 .06em}
.mf .ch.sp{display:inline-block;width:.2em}
.mf .sup{display:inline-block;font-size:.72em;vertical-align:.62em;margin-left:.04em}
.mf .sub{display:inline-block;font-size:.72em;vertical-align:-.32em}
.mf .frac{display:inline-flex;flex-direction:column;vertical-align:middle;margin:0 .12em}
.mf .frac>.blk{display:block;text-align:center;padding:0 .22em}
.mf .frac>.num{border-bottom:1.2px solid currentColor;padding-bottom:.06em}
.mf .frac>.den{padding-top:.1em}
.mf .frac>.blk.empty{align-self:center;padding:0;margin:.08em 0}
.mf .frac .frac{font-size:.92em}
.mf .par{display:inline-flex;align-items:stretch;padding:.1em 0;margin:0 .02em}
.mf .par>.pin{align-self:baseline;padding:0 .04em}
.mf .dl{width:.36em;flex:none;color:#d1d5db}
.mf .brc>.dl{width:.48em}
.mf .sqrt{display:inline-flex;align-items:stretch;margin:0 .05em}
.mf .sqrt>.rsv{width:.62em;flex:none;margin-right:-1px}
.mf .sqrt>.rad{border-top:1.2px solid currentColor;padding:.1em .12em 0;align-self:baseline}
.mf .sqrt>.idx{font-size:.6em;align-self:flex-start;margin-right:-.4em;min-width:.7em;text-align:center}
.mf .big{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .18em 0 .05em;line-height:1.05}
.mf .big>.lim{font-size:.62em}
.mf .bsym{font-size:1.65em;line-height:.95;color:var(--purple4)}
.mf .int .bsym{font-style:italic;font-size:1.55em}
.mf .cur{display:inline-block;width:0;border-left:1.6px solid #f3f4f6;height:1.1em;margin:0 -.8px;vertical-align:-.22em;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.mf.all .root{background:#3b82f655;border-radius:3px}
.mq{font-family:var(--f-math);font-size:18px;color:#fff;padding:1px 2px;min-height:26px;cursor:text;overflow-x:auto;white-space:nowrap;line-height:1.5}
.mq.raw{font:500 13.5px var(--f-mono);color:var(--g300);padding-top:4px}
.mq i{font-style:italic}
.mq .fn{font-style:normal;margin-right:1px}
.mq sup{font-size:.68em;vertical-align:.6em;line-height:0}
.mq sub{font-size:.66em;vertical-align:-.25em;line-height:0}
.mq .o{margin:0 .2em}
.mq .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.86em;margin:0 .1em;line-height:1.15}
.mq .fr>span{padding:0 .2em}
.mq .fr>span:first-child{border-bottom:1px solid currentColor;padding-bottom:1px}
.mq .rad{white-space:nowrap;display:inline-flex;align-items:stretch;margin:0 .05em}
.mq .rad .ovl{align-self:baseline}
.rsv{width:.55em;flex:none;margin-right:-1px;overflow:visible}
.mq .rs{font-size:1.1em}
.mq .ovl{border-top:1.2px solid currentColor;padding:1px .12em 0}
.mq .br{font-size:1.35em;line-height:0;vertical-align:-.08em;color:var(--g300)}
.mq .pc{color:var(--g400)}
.mq .bo{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .18em 0 .06em}
.mq .bs{font-size:1.55em;line-height:.95;color:var(--purple4)}
.mq .bb{font-size:.58em;white-space:nowrap}
.mq .bi .bs{font-style:italic;font-size:1.45em}
.mq .rix{font-size:.58em;align-self:flex-start;margin-right:-.3em;line-height:1;vertical-align:baseline}
.vp-title .mq .bo{line-height:.9}.vp-title .mq .bb{display:none}.vp-title .mq .bs{font-size:1.15em}
.st{font:11px/1.45 var(--f-mono);color:var(--g500);display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center}
.st:empty{display:none}
.st.err{color:var(--rose4)}
.st .v{font:600 14px var(--f-math);color:var(--emerald4)}
.st .add{font:600 10.5px var(--f-mono);background:#f59e0b1f;color:var(--amber3);border:1px solid #f59e0b66;border-radius:999px;padding:2px 8px;cursor:pointer}
.st .add:hover{background:#f59e0b40}
.sl{display:grid;grid-template-columns:24px 48px minmax(0,1fr) 48px;gap:6px;align-items:center}
.sl input[type=range]{width:100%;accent-color:var(--amber4);margin:0}
.ib{width:24px;height:24px;border-radius:6px;border:0;background:transparent;color:var(--g500);cursor:pointer;display:grid;place-items:center;padding:0}
.ib:hover{background:var(--g700);color:#fff}
.ib svg{width:13px;height:13px}
.ib.on{color:var(--amber3)}
.rng{display:flex;align-items:center;gap:6px;font:12px var(--f-math);color:var(--g400)}
.rng .n{width:64px}
.acts{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.sty{display:flex;flex-direction:column;gap:8px;background:var(--g900);border:1px solid var(--g800);border-radius:8px;padding:8px}
.sws{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px #0008 inset}
.sw[aria-pressed=true]{border-color:#fff}
.sty .lr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--g400)}
.sty .lr input[type=range]{flex:1;accent-color:var(--blue5)}
.sty .lr .n{width:64px}
.sty .seg{padding:2px}.sty .seg button{padding:2px 8px;font-size:11px}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:1}

main{flex:1;display:flex;min-width:0;background:#11182780;padding:8px}
.vp{flex:1;position:relative;background:radial-gradient(ellipse at 50% 45%,#0b1424 0%,var(--g950) 70%);border:1px solid var(--g800);border-radius:12px;overflow:hidden;min-height:0}
#cv{position:relative;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.dragging{cursor:grabbing}#cv.pt{cursor:move}#cv.hit{cursor:pointer}
.float{position:absolute;z-index:2;background:#111827e6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--g700);border-radius:8px;box-shadow:0 10px 15px -3px #00000080}
.vp-title{top:12px;left:12px;padding:6px 12px;font-size:12px;display:flex;align-items:center;gap:8px;pointer-events:none;max-width:calc(100% - 24px)}
.vp-title b{color:var(--g200);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp-title span{color:var(--g400);white-space:nowrap}
.vp-title .mq{font-size:15px;min-height:0;padding:0;overflow:hidden;cursor:default}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue4);flex:none}
.zoom{left:12px;bottom:12px;display:flex;align-items:center;gap:2px;padding:4px}
.zoom button{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--g300);cursor:pointer;font:600 15px var(--f-mono);display:grid;place-items:center}
.zoom button:hover{background:var(--g700);color:#fff}
.zoom span{font:10px var(--f-mono);color:var(--g500);padding:0 8px;min-width:64px;text-align:center}
.insp{right:12px;bottom:12px;padding:9px 11px;width:220px;display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--g300);pointer-events:none}
.insp .ot{font-size:10px;font-weight:700;color:var(--g400);text-transform:uppercase;letter-spacing:.05em}
.insp .r{display:flex;justify-content:space-between;gap:8px}
.insp .r span{color:var(--g400)}
.insp .r b{font:500 11px var(--f-mono);color:var(--g100);font-variant-numeric:tabular-nums;text-align:right}
.insp .note{color:var(--g500);font-size:10.5px;line-height:1.45}
.tip{padding:5px 9px;font:11px var(--f-mono);color:var(--g100);pointer-events:none;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px))}
.tip small{display:block;font:600 9.5px var(--f-sans);color:var(--g400);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:820px){html,body{height:auto}body{overflow:auto}.row{flex-direction:column;overflow:visible}main{order:-1;flex:none;height:62vh;min-height:380px}aside{width:100%;border-right:0;border-top:1px solid var(--g800);overflow:visible}.insp{width:170px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5C8 4 7 5 6.6 7.5L5 19c-.4 2-1.6 2.5-3 2"/><path d="M4 10h5"/><path d="M13 9c-1.2 2-1.2 6 0 8M21 9c1.2 2 1.2 6 0 8"/><path d="M15 10.5l4 5M19 10.5l-4 5"/></svg></div>
    <h1><span class="grad">Graphing Calculator</span> <span class="badge-v">v1.7</span></h1>
  </div>
  <div class="hctl">
    <div class="seg" id="angSeg" role="group" aria-label="Angle units"><span class="lbl">Angles</span><button data-v="rad" aria-pressed="true">Radians</button><button data-v="deg" aria-pressed="false">Degrees</button></div>
    <button class="btn" id="resetView">Default view</button>
  </div>
</header>

<div class="row">
<aside><div class="stack">

  <section class="card">
    <div class="card-h"><span class="t"><svg class="i c-purple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/></svg>Expressions</span><span class="pill" id="exPill">0</span></div>
    <div class="exl" id="exl"></div>
    <div class="addrow"><button class="btn imp" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>Add line</button><button class="btn" id="copyBtn">Copy list</button><button class="btn" id="clearBtn">Clear all</button></div>
  </section>

  <section class="card">
    <div class="card-h"><span class="t"><svg class="i c-amber" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h6M8 4v16M14 9l6 11M20 9l-6 11"/></svg>Functions</span><span class="pill">click to insert</span></div>
    <div class="fmenu" id="fmenu"></div>
  </section>

  <section class="card">
    <div class="card-h"><span class="t"><svg class="i c-blue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>Graph settings</span></div>
    <div class="win">
      <span>x min</span><input id="wx0" inputmode="decimal"><span>x max</span><input id="wx1" inputmode="decimal">
      <span>y min</span><input id="wy0" inputmode="decimal"><span>y max</span><input id="wy1" inputmode="decimal">
    </div>
    <div class="btnrow"><button class="btn" id="squareBtn">Square axes</button><button class="btn" id="fitBtn">Fit y to curves</button></div>
    <div class="toggles">

function golden(F,a,b,max){const g=(Math.sqrt(5)-1)/2;let c=b-g*(b-a),d=a+g*(b-a),fc=F(c),fd=F(d);
  for(let i=0;i<50;i++){if(max?fc>fd:fc<fd){b=d;d=c;fd=fc;c=b-g*(b-a);fc=F(c)}else{a=c;c=d;fc=fd;d=a+g*(b-a);fd=F(d)}}return (a+b)/2}
function poisFor(r,others){
  const out=[],F=r.F,N=Math.min(900,Math.ceil(W/1.2)),x0=IX(0),x1=IX(W),dx=(x1-x0)/N;
  const xs=new Float64Array(N+1),ys=new Float64Array(N+1);
  for(let i=0;i<=N;i++){xs[i]=x0+i*dx;ys[i]=F(xs[i])}
  const ok=i=>fin(ys[i])&&fin(ys[i+1])&&(Math.abs(ys[i+1]-ys[i])*V.sy<=2||contin(F,xs[i],ys[i],xs[i+1],ys[i+1],V.sy));
  const near=(x,y)=>out.some(p=>Math.abs(X(p.x)-X(x))<3&&Math.abs(Y(p.y)-Y(y))<3);
  const push=(x,t)=>{const y=F(x);if(fin(x)&&fin(y)&&!near(x,y)&&out.length<120)out.push({x,y,t,rid:r.id,c:r.color})};
  if(x0<0&&x1>0)push(0,'y-intercept');
  for(let i=0;i<N;i++){if(!ok(i))continue;const a=ys[i],b=ys[i+1];
    if(a===0&&b!==0&&(i===0||ys[i-1]!==0))push(xs[i],'x-intercept');
    else if(a*b<0)push(bisect(F,xs[i],xs[i+1],a),'x-intercept')}
  for(let i=1;i<N;i++){if(!ok(i-1)||!ok(i))continue;const d1=ys[i]-ys[i-1],d2=ys[i+1]-ys[i],tiny=1e-12*(1+Math.abs(ys[i]));
    if(Math.abs(d1)<tiny||Math.abs(d2)<tiny)continue;
    if(d1>0&&d2<0)push(golden(F,xs[i-1],xs[i+1],true),'Local max');
    else if(d1<0&&d2>0)push(golden(F,xs[i-1],xs[i+1],false),'Local min')}
  for(const o of others){if(o===r)continue;const G=o.F,D=x=>F(x)-G(x);let pd=NaN;
    for(let i=0;i<=N;i++){const g=G(xs[i]),d=ys[i]-g;
      if(i&&fin(d)&&fin(pd)&&pd*d<=0&&pd!==d&&ok(i-1)){const ex=pd===0?xs[i-1]:bisect(D,xs[i-1],xs[i],pd);const y=F(ex);if(fin(y)&&Math.abs(G(ex)-y)*V.sy<1.5&&!near(ex,y)&&out.length<120)out.push({x:ex,y,t:'Intersection',rid:r.id,c:r.color})}
      pd=d}}
  return out}

/* ---------- render ---------- */
let POIS=[],PIN=null,HOV=null,MOUSE=null;
function render(){
  EPOCH++;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  drawGrid();
  const vis=ROWS.filter(graphable);
  for(const r of vis){try{
    const sel=r.id===SEL;
    if(r.kind==='fx'||r.kind==='fy')drawExplicit(r,sel);
    else if(r.kind==='imp')drawImplicit(r,sel);
    else if(r.kind==='polar'||r.kind==='param')drawCurve2(r,sel)}catch(e){console.warn(e)}}
  // points of interest
  const eqfx=vis.filter(r=>r.kind==='fx'&&r.op==='='&&!r.nb);
  POIS=[];
  for(const r of eqfx)if(SET.poiAll||r.id===SEL){try{POIS.push(...poisFor(r,eqfx))}catch(e){}}
  for(const p of POIS){const sx=X(p.x),sy=Y(p.y);if(sx<-10||sx>W+10||sy<-10||sy>H+10)continue;
    const hov=HOV&&HOV.poi===p;ctx.beginPath();ctx.arc(sx,sy,hov?5.5:4,0,2*PI);ctx.fillStyle='#9ca3af';ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#030712';ctx.stroke()}
  // points
  for(const r of vis)if(r.kind==='point')for(let k=0,n=r.nb?r.nb():1;k<n;k++){const [x,y]=(r.nb?r.mkF(k):r.F)();if(!fin(x)||!fin(y))continue;const sx=X(x),sy=Y(y);
    const act=((HOV&&HOV.r===r)||(drag&&drag.r===r))&&(!r.nb||HOV&&HOV.k===k);
    if(r.drag){ctx.beginPath();ctx.arc(sx,sy,act?13:10,0,2*PI);ctx.fillStyle=r.color+'33';ctx.fill()}
    ctx.beginPath();ctx.arc(sx,sy,act?6.5:5,0,2*PI);ctx.fillStyle=r.color;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#030712';ctx.stroke();
    const nm=r.def&&!r.nb?ptName(r.def.name):'';
    if(r.label||act||nm){ctx.font=(nm&&!(r.label||act)?'italic 15px '+getComputedStyle(document.body).getPropertyValue('--f-math'):'12px ui-monospace,Menlo,Consolas,monospace');ctx.textAlign='left';ctx.textBaseline='bottom';const t=(r.label||act)?(nm?nm+' ':'')+`(${fmt(x,3)}, ${fmt(y,3)})`:nm;ctx.lineWidth=3;ctx.strokeStyle='#030712';ctx.strokeText(t,sx+9,sy-7);ctx.fillStyle='#f3f4f6';ctx.fillText(t,sx+9,sy-7)}}
  // pinned / traced point
  const show=PIN||(HOV&&HOV.poi);
  if(PIN&&PIN.trace){const sx=X(PIN.x),sy=Y(PIN.y);ctx.beginPath();ctx.arc(sx,sy,5.5,0,2*PI);ctx.fillStyle=PIN.c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
  else if(PIN){const sx=X(PIN.x),sy=Y(PIN.y);ctx.beginPath();ctx.arc(sx,sy,5.5,0,2*PI);ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
  const tip=$('tip');
  if(show&&fin(show.x)&&fin(show.y)){const sx=X(show.x),sy=Y(show.y);
    if(sx>=0&&sx<=W&&sy>=0&&sy<=H){tip.hidden=false;tip.style.left=sx+'px';tip.style.top=sy+'px';tip.innerHTML=(show.t?`<small>${esc(show.t)}</small>`:'')+`(${fmt(show.x)}, ${fmt(show.y)})`}else tip.hidden=true}
  else tip.hidden=true;
  liveStatus();inspector();syncWindow()}

/* ---------- inspector, title, window ---------- */
const KIND={listdef:'List',fx:'Function of x',fy:'x as a function of y',imp:'Implicit curve',polar:'Polar curve',param:'Parametric curve',point:'Point',value:'Value',slider:'Slider',vardef:'Defined number',funcdef:'Function definition'};
function kindName(r){if(!r)return '';if((r.kind==='fx'||r.kind==='fy'||r.kind==='imp')&&r.op!=='=')return 'Shaded region';if(r.def&&r.def.type==='f'&&r.kind==='fx')return 'Function '+r.def.name+'(x)';return KIND[r.kind]||''}

  const g=niceStep(V.sx,SET.pi);

  else{tr.textContent='Graphing Calculator';const n=ROWS.filter(graphable).length;ti.textContent=`· ${n} graph${n===1?'':'s'} · ${DEG?'degrees':'radians'}`;$('vpDot').style.background='var(--blue4)'}}
function syncWindow(){
  const v={wx0:IX(0),wx1:IX(W),wy0:IY(H),wy1:IY(0)};

function applyWindow(){

function greekSuffix(b){for(const w of GW){if(b.endsWith(w)){if(w==='psi'&&/[eEuU]psi$/.test(b))return null;return w}}return null}
const ch=c=>({t:'c',c});
const KEYS=n=>n.t==='c'?[]:n.t==='frac'?['n','d']:n.t==='sqrt'?(n.n?['n','b']:['b']):(n.t==='big'||n.t==='int')?['lo','hi']:['b'];

const isLet=c=>/^[a-zA-Z]$/.test(c);

const STOPF=new Set(['+','-','=','<','>','≤','≥',',',':','*',' ']);
const isDeriv=n=>n.t==='frac'&&n.n.length===1&&n.n[0].t==='c'&&n.n[0].c==='d'&&n.d.length===2&&n.d[0].t==='c'&&n.d[0].c==='d'&&n.d[1].t==='c'&&/^[a-zA-Zα-ωΑ-Ω]$/.test(n.d[1].c)&&!(n.d[1].c in CONSTS);

/* tree → text (the syntax the parser reads) */
const SIMPLE=/^(\d+\.?\d*|\.\d+|[a-zA-Z]|[α-ωΑ-Ω∞])$/;
function ser(blk,inner){
  if(!blk.length)return inner?'□':'';

  for(const n of blk){
    const letterBefore=/[a-zA-Zα-ωΑ-Ω]$/.test(out);
    switch(n.t){
      case 'c':out+=n.c;break;
      case 'sup':{const s=ser(n.b,1);out+=SIMPLE.test(s)?'^'+s:'^('+s+')';break}
      case 'sub':{const s=ser(n.b,1);out+=/^[a-zA-Z0-9]+$/.test(s)?'_'+s:'_('+s+')';break}
      case 'frac':{
        if(isDeriv(n)){out+=(letterBefore?' ':'')+'d/d{'+n.d[1].c+'}';break}
        const a=ser(n.n,1),b=ser(n.d,1);
        out+=(letterBefore?'*':'')+'('+(SIMPLE.test(a)?a:'('+a+')')+'/'+(SIMPLE.test(b)?b:'('+b+')')+')';break}
      case 'par':out+='('+ser(n.b)+')';break;
      case 'brace':out+='{'+ser(n.b)+'}';break;
      case 'brk':out+='['+ser(n.b)+']';break;
      case 'sqrt':out+=(n.n?'√['+ser(n.n,1)+']':'√')+'{'+ser(n.b,1)+'}';break;
      case 'big':out+=n.sym+'_{'+ser(n.lo,1)+'}^{'+ser(n.hi,1)+'}';break;
      case 'int':out+='∫_{'+ser(n.lo,1)+'}^{'+ser(n.hi,1)+'}';break}}

/* text → tree: from the parsed AST when the line parses, otherwise character by character */
const Cs=s=>[...s].map(ch);
const strip2=n=>n.k==='paren'?n.a:n;

    if(n.op==='^')return [...(n.a.k==='paren'?[{t:'par',b:tt(n.a.a)}]:tt(n.a)),{t:'sup',b:tt(strip2(n.b))}];

      const la=A[A.length-1],fb=B[0];
      const sp=la&&fb&&la.t==='c'&&fb.t==='c'&&((isLet(la.c)&&isLet(fb.c))||(/[0-9.]/.test(la.c)&&/[0-9.]/.test(fb.c)));

    if(n.n==='nthroot')return [{t:'sqrt',n:tt(strip2(n.A[1])),b:tt(strip2(n.A[0]))},...pw];

    if(n.pa)return [...head,{t:'par',b:joinT(n.A.map(tt),', ')}];
    return [...head,ch(' '),...tt(n.A[0])]}

  case 'tuple':return [{t:'par',b:joinT(n.A.map(tt),', ')}];
  case 'list':return [{t:'brk',b:joinT(n.A.map(tt),', ')}];
  case 'range':return [{t:'brk',b:n.b?[...tt(n.a),...Cs(', '),...tt(n.b),...Cs(', ..., '),...tt(n.c)]:[...tt(n.a),...Cs('...'),...tt(n.c)]}];

  case 'sum':case 'prod':return [{t:'big',sym:n.k==='sum'?'Σ':'∏',lo:[...varT(n.v),ch('='),...tt(strip2(n.lo))],hi:tt(strip2(n.hi))},...tt(n.body)];
  case 'int':return [{t:'int',lo:tt(strip2(n.lo)),hi:tt(strip2(n.hi))},...tt(n.body),ch(' '),ch('d'),...varT(n.v)];

function decRaw(src){

/* ---------- pointer interaction ---------- */
let drag=null;const ptrs=new Map();
const posOf=e=>{const b=cv.getBoundingClientRect();return {x:e.clientX-b.left,y:e.clientY-b.top}};
const SUBD={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
function ptName(v){const i=v.indexOf('_');return i<0?v:v.slice(0,i)+[...v.slice(i+1)].map(c=>SUBD[c]||c).join('')}
function hitTest(x,y){
  const vis=ROWS.filter(graphable);let best=null,bd=1e9;
  for(const r of vis)if(r.kind==='point')for(let k=0,n=r.nb?r.nb():1;k<n;k++){const [px,py]=(r.nb?r.mkF(k):r.F)();if(!fin(px)||!fin(py))continue;const d=Math.hypot(X(px)-x,Y(py)-y);if(d<14&&d<bd){bd=d;best={type:'pt',r,k,x:px,y:py}}}
  if(best)return best;
  for(const p of POIS){const d=Math.hypot(X(p.x)-x,Y(p.y)-y);if(d<10&&d<bd){bd=d;best={type:'poi',poi:p}}}
  if(best)return best;
  for(const r of vis){if(r.nb)continue;if(r.kind==='fx'){const v=r.F(IX(x));if(!fin(v))continue;const d=Math.abs(Y(v)-y);if(d<10&&d<bd){bd=d;best={type:'curve',r}}}
    else if(r.kind==='fy'){const v=r.F(IY(y));if(!fin(v))continue;const d=Math.abs(X(v)-x);if(d<10&&d<bd){bd=d;best={type:'curve',r}}}}
  return best}
function doTrace(p){
  const r=drag.r;let x,y;
  if(r.kind==='fx'){x=IX(p.x);const sn=POIS.find(q=>q.rid===r.id&&Math.abs(X(q.x)-p.x)<8);if(sn){x=sn.x;y=sn.y;PIN={...sn,trace:false};return}y=r.F(x)}
  else{y=IY(p.y);x=r.F(y)}
  PIN=fin(x)&&fin(y)?{x,y,t:'',rid:r.id,c:r.color,trace:true}:null}
function selectRow(id){SEL=id;markSel();const el=rowDom(id);if(el)el.scrollIntoView({block:'nearest'})}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const p=posOf(e);ptrs.set(e.pointerId,p);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};drag={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,sx:V.sx,sy:V.sy,wx:IX(m.x),wy:IY(m.y)};return}

  else if(h&&h.type==='poi'){PIN={...h.poi};drag={type:'none'}}

  else{drag={type:'pan',x:p.x,y:p.y,cx:V.cx,cy:V.cy,moved:false};cv.className='dragging'}
  req()});
cv.addEventListener('pointermove',e=>{
  const p=posOf(e);MOUSE=p;if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,p);
  if(!drag){const h=hitTest(p.x,p.y);const nh=h&&(h.type==='poi'?{poi:h.poi}:h.type==='pt'?{r:h.r,k:h.k}:null);
    if((nh&&nh.poi)!==(HOV&&HOV.poi)||(nh&&nh.r)!==(HOV&&HOV.r)||(nh&&HOV&&nh.k!==HOV.k))HOV=nh;
    cv.className=h?(h.type==='pt'&&h.r.drag?'pt':'hit'):'';req();return}
  if(drag.type==='pinch'&&ptrs.size===2){const [a,b]=[...ptrs.values()],m={x:(a.x+b.x)/2,y:(a.y+b.y)/2},s=Math.hypot(a.x-b.x,a.y-b.y)/drag.d0;
    V.sx=drag.sx*s;V.sy=drag.sy*s;V.cx=drag.wx-(m.x-W/2)/V.sx;V.cy=drag.wy+(m.y-H/2)/V.sy;req();return}
  if(drag.type==='pan'){const dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;V.cx=drag.cx-dx/V.sx;V.cy=drag.cy+dy/V.sy;req()}
  else if(drag.type==='trace'){doTrace(p);req()}
  else if(drag.type==='pt')dragPoint(drag.r,IX(p.x),IY(p.y))});
function endPtr(e){

function zoomAt(px,py,fx,fy){const wx=IX(px),wy=IY(py);V.sx=Math.min(1e9,Math.max(1e-7,V.sx*fx));V.sy=Math.min(1e9,Math.max(1e-7,V.sy*fy));V.cx=wx-(px-W/2)/V.sx;V.cy=wy+(py-H/2)/V.sy;saveSoon();req()}
